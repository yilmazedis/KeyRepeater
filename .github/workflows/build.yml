name: Build Windows exe

# Every push builds the exe (downloadable from the run's Artifacts).
# Pushing a version tag like v1.2.0 also publishes a GitHub Release with the exe.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller
      - run: python -m PyInstaller --noconfirm --onefile --windowed --name KeyRepeater key_repeater.py
      - uses: actions/upload-artifact@v4
        with:
          name: KeyRepeater
          path: dist/KeyRepeater.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          SHA=$(sha256sum dist/KeyRepeater.exe | cut -d' ' -f1)
          cat > notes.md <<EOF
          Key Repeater presses up to 5 keys automatically, each at its own millisecond interval. It's built for **software testing** and **accessibility**.

          ## Download
          Download **KeyRepeater.exe** below and run it. Python is not needed.

          On first launch Windows SmartScreen may say "Windows protected your PC". The exe isn't code-signed, so click **More info → Run anyway**.

          If the target app runs as Administrator, run KeyRepeater.exe as Administrator too.

          Only use Key Repeater where automated input is allowed; you are responsible for following each app's or service's terms of use.

          SHA-256: \`$SHA\`
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/KeyRepeater.exe --clobber
          else
            gh release create "$TAG" dist/KeyRepeater.exe \
              --title "Key Repeater $TAG" --notes-file notes.md --generate-notes --verify-tag
          fi
